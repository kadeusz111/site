<!-- 🔥 DODANY JS -->
<script>
const titleEl = document.querySelector(".title");
const blogList = document.getElementById("blogList");
const postView = document.getElementById("postView");
const backBtn = document.getElementById("backBtn");

let posts = [];

// LOAD POSTS
fetch("./posts/posts.json")
  .then(r => r.json())
  .then(data => {
    posts = data;
    renderList();
  });

function formatName(file) {
  return file
    .replace(".md", "")
    .replace(/-/g, " ");
}

function renderList() {
  blogList.innerHTML = "";

  posts.slice().reverse().forEach(p => {
    const div = document.createElement("div");
    div.className = "blog-item";
    div.textContent = formatName(p.file);

    div.onclick = () => openPost(p.file);

    blogList.appendChild(div);
  });
}

function openPost(file) {
  blogList.style.display = "none";
  postView.classList.remove("hidden");
  backBtn.classList.remove("hidden");

  titleEl.style.display = "none";

  fetch("./posts/" + file)
    .then(r => r.text())
    .then(md => {
      postView.innerHTML = markdown(md);
    });
}

backBtn.onclick = () => {
  blogList.style.display = "flex";
  postView.classList.add("hidden");
  backBtn.classList.add("hidden");
  postView.innerHTML = "";

  titleEl.style.display = "block";
};

function markdown(text) {
  return text
    .replace(/^# (.*$)/gim, "<h1>$1</h1>")

    .replace(/!\s*\[(.*?)\]\s*\((.*?)\)/g,
      '<img src="$2" alt="$1" style="max-width:100%; outline:2px solid white;">'
    )

    .replace(/\n/g, "<br>");
}
</script>
